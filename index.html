<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>答題判定</title>
<style>
  :root{
    --paper:#E5E8E1;
    --paper-lift:#F2F4EF;
    --card:#FCFCFA;
    --card-lit:#FFFFFF;
    --edge:#D2D7CB;
    --ink:#454A44;
    --ink-soft:#7B827A;
    --sage:#93A691;
    --sage-deep:#5E7159;
    --clay:#BD8B7F;
    --clay-deep:#8D5F54;
    --sans:"PingFang TC","Noto Sans TC","Hiragino Sans","Microsoft JhengHei",
           -apple-system,system-ui,sans-serif;
  }

  *{box-sizing:border-box;}

  html,body{height:100%;margin:0;}

  body{
    font-family:var(--sans);
    color:var(--ink);
    background:
      radial-gradient(140% 100% at 50% 0%, var(--paper-lift) 0%, var(--paper) 70%),
      var(--paper);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:max(28px,env(safe-area-inset-top)) 22px max(28px,env(safe-area-inset-bottom));
    -webkit-user-select:none;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
    overflow:hidden;
  }

  .board{
    display:flex;
    gap:clamp(14px,2vw,22px);
    width:min(920px,100%);
  }

  .pad{
    flex:1;
    position:relative;
    appearance:none;
    border:none;
    cursor:pointer;
    font-family:inherit;
    color:var(--ink);
    background:var(--card);
    border-radius:4px;
    padding:clamp(26px,4.4vh,44px) 14px clamp(22px,3.6vh,34px);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:clamp(16px,2.6vh,26px);
    box-shadow:
      0 1px 2px rgba(60,66,58,.05),
      0 10px 24px rgba(60,66,58,.08);
    transition:background-color .3s ease, box-shadow .3s ease;
  }

  .pad::before{
    content:"";
    position:absolute;
    inset:0 0 auto 0;
    height:5px;
    border-radius:4px 4px 0 0;
    background:var(--tone);
  }

  .pad.correct{--tone:var(--sage); --tone-deep:var(--sage-deep);}
  .pad.wrong{--tone:var(--clay); --tone-deep:var(--clay-deep);}

  .pad:active,.pad.hit{
    background-color:var(--card-lit);
    box-shadow:
      0 0 0 1.5px var(--tone),
      0 2px 4px rgba(60,66,58,.06),
      0 14px 30px rgba(60,66,58,.11);
  }

  .pad:focus-visible{outline:2px solid var(--ink);outline-offset:5px;}

  .glyph{
    position:relative;
    width:clamp(92px,15vw,152px);
    height:clamp(92px,15vw,152px);
    display:grid;
    place-items:center;
  }

  .glyph svg{width:100%;height:100%;overflow:visible;}

  .glyph path,.glyph circle{
    fill:none;
    stroke:var(--tone-deep);
    stroke-width:15;
    stroke-linecap:round;
  }

  .halo{
    position:absolute;
    inset:-8%;
    border-radius:50%;
    border:1.5px solid var(--tone-deep);
    opacity:0;
    pointer-events:none;
  }

  .pad.hit .halo{animation:ping .6s ease-out;}

  @keyframes ping{
    from{opacity:.5; transform:scale(.88);}
    to{opacity:0; transform:scale(1.28);}
  }

  .label{
    font-size:clamp(15px,1.9vw,19px);
    font-weight:400;
    letter-spacing:.36em;
    text-indent:.36em;
    line-height:1;
    color:var(--ink-soft);
  }

  @media (max-width:560px){
    .board{flex-direction:column;}
    .pad{flex-direction:row;justify-content:center;gap:22px;padding:22px 20px;}
    .pad::before{inset:0 auto 0 0;width:5px;height:auto;border-radius:4px 0 0 4px;}
    .glyph{width:62px;height:62px;}
  }

  @media (prefers-reduced-motion:reduce){
    .pad{transition:none;}
    .pad.hit .halo{animation:none;}
  }
</style>
</head>
<body>

<div class="board">
  <button class="pad correct" id="padCorrect" aria-label="答對">
    <span class="glyph">
      <span class="halo"></span>
      <svg viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="46"/></svg>
    </span>
    <span class="label">答對</span>
  </button>

  <button class="pad wrong" id="padWrong" aria-label="答錯">
    <span class="glyph">
      <span class="halo"></span>
      <svg viewBox="0 0 120 120" aria-hidden="true"><path d="M27 27 L93 93 M93 27 L27 93"/></svg>
    </span>
    <span class="label">答錯</span>
  </button>
</div>

  var ctx = null, buffers = {}, fallback = {}, ready = false;

  function b64ToBytes(b64){
    var bin = atob(b64), len = bin.length, bytes = new Uint8Array(len);
    for (var i = 0; i < len; i++) bytes[i] = bin.charCodeAt(i);
    return bytes.buffer;
  }

  function makeFallback(){
    Object.keys(SOUNDS).forEach(function(k){
      var a = new Audio("data:audio/mp4;base64," + SOUNDS[k]);
      a.preload = "auto";
      fallback[k] = a;
    });
  }

  function initAudio(){
    if (ready) return;
    ready = true;
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) { makeFallback(); return; }
    ctx = new AC();
    Object.keys(SOUNDS).forEach(function(k){
      try {
        ctx.decodeAudioData(b64ToBytes(SOUNDS[k]),
          function(buf){ buffers[k] = buf; },
          function(){ makeFallback(); });
      } catch(e){ makeFallback(); }
    });
  }

  function play(kind){
    initAudio();
    if (ctx){
      if (ctx.state === "suspended") ctx.resume();
      if (buffers[kind]){
        var src = ctx.createBufferSource();
        src.buffer = buffers[kind];
        src.connect(ctx.destination);
        src.start(0);
        return;
      }
    }
    var a = fallback[kind];
    if (a){ a.currentTime = 0; a.play(); }
  }

  function fire(pad, kind){
    play(kind);
    pad.classList.remove("hit");
    void pad.offsetWidth;
    pad.classList.add("hit");
    setTimeout(function(){ pad.classList.remove("hit"); }, 600);
  }

  var padCorrect = document.getElementById("padCorrect");
  var padWrong = document.getElementById("padWrong");

  padCorrect.addEventListener("click", function(){ fire(padCorrect, "correct"); });
  padWrong.addEventListener("click", function(){ fire(padWrong, "wrong"); });

  document.addEventListener("keydown", function(e){
    if (e.repeat) return;
    var k = e.key.toLowerCase();
    if (k === "1" || k === "o"){ e.preventDefault(); fire(padCorrect, "correct"); }
    if (k === "2" || k === "x"){ e.preventDefault(); fire(padWrong, "wrong"); }
  });

  ["touchstart","mousedown"].forEach(function(ev){
    document.addEventListener(ev, initAudio, { once:true, passive:true });
  });
})();
